name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "also run the end-to-end trainer tests (~10 min)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt einops ruff
      - name: SurvPath data repo (splits, metadata, RNA, pathways)
        run: git clone --depth 1 https://github.com/mahmoodlab/SurvPath data/survpath_repo
      - name: Dummy BLCA features
        run: python scripts/make_dummy_embeddings.py --cancer blca
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: python -m pytest -m "not slow"
      - name: End-to-end trainer tests
        if: github.event_name == 'workflow_dispatch' && inputs.slow
        run: python -m pytest -m slow
      - name: Tables from archived results
        run: |
          PY=python bash scripts/reproduce_tables.sh
          head -n 12 results/final/table1_dss_20ep_vs_survpath.txt
