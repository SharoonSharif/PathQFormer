# PathQ-Former v2 'fast' optimisation schedule for small cohorts (STAD/HNSC/COADREAD/BRCA).
# Motivation (2026-09-10 STAD diagnosis): lr 5e-5 with 8-step accumulation gives ~35 updates/epoch, so
# val-loss patience fired while the val C-index was still rising in 3/5 folds. This config gives 8x more
# learning per epoch (lr 1e-4, accumulation 2), trains at least 8 epochs and waits 6 for improvement.
# Everything else (data, splits, bins, scaler, selection rule, metrics) is identical to blca_hybrid_v2.yaml.
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_v2/hybrid_fast
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.25
modality_dropout: 0.15
lr: 0.0001
weight_decay: 0.0001
warmup_epochs: 1
epochs: 20
patience: 6
min_epochs: 8
selection_metric: val_loss
batch_size: 1
grad_accum_steps: 2
clip_grad_norm: 1.0
nll_alpha: 0.0
pathway_hidden_dim: 128
min_genes: 3
max_genes: 300
max_patches: null
num_folds: 5
num_workers: 4
cache_in_ram: false
eval_missing: true
missing_rates:
- 0.1
- 0.2
- 0.3
- 0.5
missing_repeats: 5
bootstrap: 1000
