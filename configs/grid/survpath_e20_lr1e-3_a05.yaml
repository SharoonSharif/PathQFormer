# SurvPath grid point under the fixed 20-epoch protocol: lr 1e-3, nll_alpha 0.5 (published: 5e-4, 0.5).
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_grid/survpath_e20_lr1e-3_a05
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.1
modality_dropout: 0.0
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 0
