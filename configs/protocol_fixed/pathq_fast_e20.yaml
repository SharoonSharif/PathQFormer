# Fixed budget, 20 epochs, final checkpoint. The pooled per-epoch curve of pathq_fast_e10 was still rising at
# epoch 10 while SurvPath had flattened; a 20-epoch history also yields the 10-epoch number post hoc.
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_e20/pathq_fast_e20
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.25
modality_dropout: 0.15
lr: 0.0001
weight_decay: 0.0001
warmup_epochs: 1
epochs: 20
patience: 99
min_epochs: 0
selection_metric: last
batch_size: 1
grad_accum_steps: 2
clip_grad_norm: 1.0
nll_alpha: 0.0
pathway_hidden_dim: 128
min_genes: 3
max_genes: 300
max_patches: null
num_folds: 5
num_workers: 4
cache_in_ram: false
eval_missing: true
missing_rates:
- 0.1
- 0.2
- 0.3
- 0.5
missing_repeats: 5
bootstrap: 1000
