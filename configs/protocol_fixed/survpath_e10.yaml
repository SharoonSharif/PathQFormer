# Fixed-budget protocol (2026-09-11): train exactly `epochs` epochs, no early stopping, report the FINAL
# checkpoint (selection_metric: last) - the MCAT/SurvPath convention. Motivation: with 7-16 events per
# validation fold, val-loss selection picked epoch 1-3 checkpoints for every method on STAD/HNSC/BRCA and
# all of them landed near chance. Best-epoch numbers are still logged as an optimistic upper bound.
# Official SurvPath with its repo hyper-parameters (RAdam 5e-4, weighted sampling, alpha 0.5, 4096 patches), 10 epochs.
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_v2/survpath_e10
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.1
modality_dropout: 0.0
lr: 0.0005
weight_decay: 0.0001
warmup_epochs: 0
epochs: 10
patience: 99
min_epochs: 0
selection_metric: last
batch_size: 1
grad_accum_steps: 1
clip_grad_norm: 1.0
nll_alpha: 0.5
pathway_hidden_dim: 128
min_genes: 3
max_genes: 300
max_patches: 4096
num_folds: 5
num_workers: 4
cache_in_ram: false
eval_missing: false
missing_rates:
- 0.1
- 0.2
- 0.3
- 0.5
missing_repeats: 5
bootstrap: 1000
optimizer: radam
weighted_sample: true
model_type: survpath
