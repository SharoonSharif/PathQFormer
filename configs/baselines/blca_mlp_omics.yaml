# Baseline: 2-layer MLP on all 4,999 genes, genomics only.
# Hyper-parameters follow the SurvPath repository run scripts (RAdam, lr 0.0005, wd 1e-4, alpha_surv 0.5,
# weighted (bin, censorship) sampling, 4096 training patches). Data, splits, bins, scaler, selection and
# metrics are identical to configs/blca_hybrid_v2.yaml so the comparison is fair.
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_v2/baseline_mlp_omics
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.1
modality_dropout: 0.0
lr: 0.0005
weight_decay: 0.0001
warmup_epochs: 0
epochs: 20
patience: 5
min_epochs: 6
selection_metric: val_loss
batch_size: 1
grad_accum_steps: 1
clip_grad_norm: 1.0
nll_alpha: 0.5
pathway_hidden_dim: 128
min_genes: 3
max_genes: 300
max_patches: 4096
num_folds: 5
num_workers: 4
cache_in_ram: false
eval_missing: false
missing_rates:
- 0.1
- 0.2
- 0.3
- 0.5
missing_repeats: 5
bootstrap: 1000
optimizer: radam
weighted_sample: true
model_type: mlp_omics
