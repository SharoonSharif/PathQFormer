# Ablation (fixed-budget protocol, 10 epochs, final checkpoint): genomics-only PathQ-Former (for the late-fusion baseline)
# Base: configs/protocol_fixed/pathq_fast_e10.yaml
survpath_dir: data/survpath_repo
embeddings_dir: data/embeddings/uni2h
output_dir: outputs_v2/pathq_fast_e10_genomic_only
cancer_type: blca
pathway_type: combine
endpoint: dss
scaler: minmax
seed: 0
wsi_input_dim: 1536
hidden_dim: 256
num_queries: 32
num_heads: 8
query_layers: 2
fusion_layers: 2
num_bins: 4
norm_first: true
dropout: 0.25
modality_dropout: 0.15
lr: 0.0001
weight_decay: 0.0001
warmup_epochs: 1
epochs: 10
patience: 99
min_epochs: 0
selection_metric: last
batch_size: 1
grad_accum_steps: 2
clip_grad_norm: 1.0
nll_alpha: 0.0
pathway_hidden_dim: 128
min_genes: 3
max_genes: 300
max_patches: null
num_folds: 5
num_workers: 4
cache_in_ram: false
eval_missing: false
missing_rates:
- 0.1
- 0.2
- 0.3
- 0.5
missing_repeats: 5
bootstrap: 1000
train_modalities: genomic
