[project]
name = "pathqformer"
version = "0.2.0"
description = "PathQ-Former: query-based multimodal fusion of WSI and pathway tokens for cancer survival prediction"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Sharoon Sunny Thomas"}]

[project.urls]
Repository = "https://github.com/SharoonSharif/PathQFormer"
Report = "https://github.com/SharoonSharif/PathQFormer/blob/master/REPORT.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end training on the dummy embeddings (minutes); deselect with -m 'not slow'"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "notebooks", "outputs*", "pod_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B006", "B008"]
ignore = ["E501", "E741"]

