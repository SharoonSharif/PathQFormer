[project]
name = "pathqformer"
version = "0.2.0"
description = "PathQ-Former: query-based multimodal fusion of WSI and pathway tokens for cancer survival prediction"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
