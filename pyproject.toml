[project]
name = "pathqformer"
version = "0.2.0"
description = "PathQ-Former: query-based multimodal fusion of WSI and pathway tokens for cancer survival prediction"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end training on the dummy embeddings (minutes); deselect with -m 'not slow'"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
